<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Operations console for sales, inventory, purchasing, finance and people — Phase 1 + 2 application shell." />
    <title>Ledgerline ERP — Operations Console</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('ledgerline-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
